<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account · Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <!-- Left: brand panel -->
  <section class="brand-panel">
    <div class="brand-mark"><span class="dot"></span> vault access</div>

    <div class="brand-hero">
      <h1>Create your<br /><em>secure</em> account.</h1>
      <p>Takes under a minute. Your password is hashed with bcrypt before it ever touches the database.</p>
    </div>

    <svg class="rings" viewBox="0 0 320 320" aria-hidden="true">
      <circle class="ring-outer" cx="160" cy="160" r="150" />
      <circle class="ring-mid" cx="160" cy="160" r="112" />
      <circle class="ring-inner" cx="160" cy="160" r="78" />
    </svg>

    <div class="status-ticker">
      <span class="status-pulse checking" data-status-dot></span>
      <span data-status-label>checking connection…</span>
    </div>
  </section>

  <!-- Right: form panel -->
  <section class="auth-panel">
    <div class="auth-card">
      <p class="eyebrow">Get started</p>
      <h2>Create an account</h2>
      <p class="subtext">Fill in your details below.</p>

      <div class="alert" data-alert></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Ada Lovelace" autocomplete="name" required />
          <p class="hint" data-hint-name></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          <p class="hint" data-hint-email></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
          <p class="hint" data-hint-password>Minimum 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
          <p class="hint" data-hint-confirm></p>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>
    </div>
  </section>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/status.js"></script>
<script src="js/register.js"></script>
</body>
</html>
